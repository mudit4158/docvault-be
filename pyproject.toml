[project]
name = "docvault-be"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    # bcrypt directly, not passlib: passlib 1.7.4 (2020, unmaintained) reads
    # bcrypt.__about__ which bcrypt 4.1 removed, breaking every hash call.
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    # Reads PDF page counts server-side; the client's count is never trusted.
    "pypdf>=5.0.0",
    # Primary storage backend. Sync client under the hood (built on `requests`);
    # GCSStorage wraps every call in asyncio.to_thread, matching LocalStorage's
    # existing pattern rather than pulling in a separate async-native client.
    "google-cloud-storage>=2.18.0",
    # OTP login: verifies the Firebase ID token the Android app obtains from
    # Firebase Phone Auth (client-driven — this backend never sends SMS itself).
    "firebase-admin>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",  # in-memory test database
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
